name: Daily job scan
on:
  schedule:
    - cron: "0 13 * * *"   # 9am ET daily
  workflow_dispatch: {}      # manual run button
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scan_jobs.py
      - name: Commit report
        run: |
          git config user.name "job-scanner"
          git config user.email "actions@github.com"
          git add JOBS.md
          git diff --cached --quiet || git commit -m "Job scan $(date +%F)"
          git pull --rebase origin main
          git push
